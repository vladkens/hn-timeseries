# https://fly.io/docs/reference/configuration/
app = 'ynews'
primary_region = 'ams'

[build]
dockerfile = 'Dockerfile'

[env]
DB_PATH = '/data/ynews.db'

[[mounts]]
source = 'sqlite_data'
destination = '/data'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = '30s'
timeout = '5s'
grace_period = '10s'
method = 'GET'
path = '/health'

[[vm]]
size = 'shared-cpu-1x'
memory = '256mb'
cpus = 1
