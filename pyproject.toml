[project]
name = "hn-timeseries"
version = "0.1.0"
description = "Hourly time series of Hacker News top-500 rankings, scores, and comment counts"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["httpx>=0.28.1", "loguru>=0.7.3"]

[dependency-groups]
dev = ["ruff>=0.1.11", "ty>=0.0.41"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
